<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailní Widget Serveru</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .server-card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #334155;
        }

        .server-icon {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .server-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        .version-badge {
            background-color: #3b82f6;
            color: #fff;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .motd {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 15px;
            min-height: 40px;
        }

        .stat-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .status-online { color: #4ade80; }
        .status-offline { color: #f87171; }
    </style>
</head>
<body>

    <div class="server-card">
        <!-- Ikona serveru -->
        <img id="server-icon" class="server-icon" src="https://api.mcsrvstat.us/icon/mystiland.eu" alt="Server Icon">

        <h2 class="server-name">Mystiland.eu</h2>
        <span id="server-version" class="version-badge">Načítání...</span>

        <!-- Popisek serveru (MOTD) -->
        <div id="server-motd" class="motd">Načítání popisu...</div>

        <!-- Počet hráčů -->
        <div class="stat-group">
            <span>Stav:</span>
            <span id="server-players" class="stat-value">0 / 0</span>
        </div>
    </div>

    <script>
        async function loadAdvancedStats() {
            const serverIP = 'mystiland.eu';

            try {
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIP}`);
                const data = await response.json();

                if (data && data.online) {
                    // Verze Minecraftu
                    document.getElementById('server-version').textContent = data.version || 'Neznámá verze';

                    // MOTD (Popis serveru) - vyčištěný od formátovacích znaků
                    if (data.motd && data.motd.clean) {
                        document.getElementById('server-motd').textContent = data.motd.clean.join(' ');
                    } else {
                        document.getElementById('server-motd').textContent = 'Bez popisu';
                    }

                    // Hráči online
                    const playersElement = document.getElementById('server-players');
                    playersElement.textContent = `${data.players.online} / ${data.players.max}`;
                    playersElement.className = 'stat-value status-online';

                } else {
                    document.getElementById('server-version').textContent = 'OFFLINE';
                    document.getElementById('server-motd').textContent = 'Server je momentálně nedostupný.';
                    
                    const playersElement = document.getElementById('server-players');
                    playersElement.textContent = 'Offline';
                    playersElement.className = 'stat-value status-offline';
                }
            } catch (error) {
                console.error('Chyba při načítání dat:', error);
                document.getElementById('server-motd').textContent = 'Chyba připojení k API.';
            }
        }

        loadAdvancedStats();
    </script>
</body>
</html>
