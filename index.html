<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiky Serveru - Mystiland.eu</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .stat-card {
            background-color: #1b263b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            text-align: center;
            min-width: 250px;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: #4cc9f0;
            margin: 10px 0;
        }

        .stat-label {
            color: #e0e1dd;
            font-size: 1.1rem;
        }

        .status-dot {
            height: 12px;
            width: 12px;
            background-color: #777;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .online { background-color: #2ec4b6; }
        .offline { background-color: #e63946; }
    </style>
</head>
<body>

    <div class="stat-card">
        <h2>Mystiland.eu</h2>
        <p><span id="status-dot" class="status-dot"></span><span id="server-status">Načítání...</span></p>
        
        <!-- Místo, kam se načte počet hráčů -->
        <div class="stat-value" id="player-count">0</div>
        <p class="stat-label">Hráčů právě online</p>
    </div>

    <script>
        async function fetchServerStats() {
            const serverIP = 'mystiland.eu';
            const playerCountElement = document.getElementById('player-count');
            const statusElement = document.getElementById('server-status');
            const statusDot = document.getElementById('status-dot');

            try {
                // Stažení dat o serveru přes veřejné API mcsrvstat.us
                const response = await fetch(`https://api.mcsrvstat.us/3/${serverIP}`);
                const data = await response.json();

                if (data && data.online) {
                    // Server je online – vypíšeme aktuální počet hráčů (např. "42 / 100")
                    playerCountElement.textContent = `${data.players.online} / ${data.players.max}`;
                    statusElement.textContent = 'Server je Online';
                    statusDot.className = 'status-dot online';
                } else {
                    // Server je offline
                    playerCountElement.textContent = '0';
                    statusElement.textContent = 'Server je Offline';
                    statusDot.className = 'status-dot offline';
                }
            } catch (error) {
                console.error('Chyba při načítání statistik:', error);
                playerCountElement.textContent = '?';
                statusElement.textContent = 'Chyba připojení';
                statusDot.className = 'status-dot offline';
            }
        }

        // Načte data hned po otevření stránky
        fetchServerStats();

        // (Volitelné) Automaticky aktualizuje počet hráčů každých 30 sekund
        setInterval(fetchServerStats, 30000);
    </script>
</body>
</html>
